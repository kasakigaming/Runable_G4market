# Mỗi tuần làm mới danh sách tên game Steam (data/steam-index.json) cho ô tìm kiếm của backend.
# Chỉ tải các trang SteamSpy (~1 phút/1.000 game), không tra từng game. Backend tự tải lại file này mỗi ngày.
name: Cập nhật danh sách tên game

on:
  schedule:
    - cron: "0 19 * * 0"     # 02:00 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:
    inputs:
      pages:
        description: "Số trang SteamSpy (1000 game mỗi trang)"
        default: "10"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tải danh sách tên từ SteamSpy
        run: node tools/build-index.mjs --pages "${{ inputs.pages || 10 }}"
      - name: Commit nếu có thay đổi
        run: |
          git add data/steam-index.json
          if git diff --cached --quiet; then echo "Không đổi."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cập nhật danh sách tên game $(date -u +%Y-%m-%d)"
          git push
